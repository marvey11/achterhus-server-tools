repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
      - id: check-shebang-scripts-are-executable

  # Shellcheck via the pre-commit mirror
  - repo: https://github.com/koalaman/shellcheck-precommit
    rev: v0.11.0
    hooks:
      - id: shellcheck
        # Tell shellcheck to look in lib too
        files: ^(bin|lib)/.*\.(sh|bash)$

  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.49.1
    hooks:
      - id: markdownlint
        # Optional: create a .markdownlint.json
        args: ["--fix", "--disable", "MD013"] # MD013 disables line length limits
